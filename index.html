<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1e38">
  <meta name="description" content="A cozy bedtime incremental game: count sheep until you fall asleep.">
  <title>Counting Sheep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div id="dp" class="chip" title="Dream Points: each one is +5% production forever" hidden>
        <span aria-hidden="true">☾</span> <span id="dpVal">0</span>
      </div>
      <h1>Counting Sheep</h1>
      <button id="mute" class="round" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="note" d="M9 17.5a2.5 2.5 0 1 1-2.5-2.5c.5 0 1 .1 1.5.4V5l10-2v11.5a2.5 2.5 0 1 1-2.5-2.5c.5 0 1 .1 1.5.4V6.3L10 7.8v9.7z"/><path class="slash" d="M4 3l17 18" /></svg>
      </button>
    </header>

    <section id="scene" tabindex="0" role="button" aria-label="Tap to count a sheep (space or enter)">
      <canvas id="view"></canvas>
      <div class="hud" aria-live="off">
        <div id="count" class="count">0</div>
        <div class="unit">sheep</div>
        <div id="rate" class="rate">0 per second</div>
        <p id="line" class="line"></p>
      </div>
      <div id="hint" class="hint" aria-hidden="true">Tap to count a sheep</div>
      <div id="banner" class="banner" role="status"></div>
    </section>

    <div id="drowsy" class="drowsy" role="progressbar" aria-label="Drowsiness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="dlabel">Drowsiness</span>
      <div class="bar"><i id="drowsyFill"></i></div>
      <span id="drowsyPct" class="pct">0%</span>
    </div>

    <main id="shop">
      <div class="buymode" role="group" aria-label="How many to buy">
        <button type="button" data-mode="1" aria-pressed="true">×1</button>
        <button type="button" data-mode="10" aria-pressed="false">×10</button>
        <button type="button" data-mode="max" aria-pressed="false">Max</button>
      </div>
      <section id="secTap" hidden><h2>Tapping</h2><div id="listTap" class="list"></div></section>
      <section id="secGen"><h2>Helpers</h2><div id="listGen" class="list"></div></section>
      <section id="secMult" hidden><h2>Comforts</h2><div id="listMult" class="list"></div></section>
    </main>
  </div>

  <div id="modal" class="modal" hidden aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button id="modalButton" class="cta" type="button"></button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="num.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
